# An ESP32 of its own near the TV: a "Xiaomi TV wake" button in Home Assistant.
esphome:
  name: xiaomi-wake

esp32:
  board: esp32dev            # or esp32-c3-devkitm-1, esp32-s3-devkitc-1…
  framework:
    type: esp-idf

external_components:
  - source: github://dckiller51/esphome-xiaomi-ble-wake
    components: [xiaomi_ble_wake]

esp32_ble:

xiaomi_ble_wake:
  id: tv_wake
  remote_mac: "00:E0:4C:FB:BC:21"   # your TV's remote: see the README
  tv_mac: "60:1D:9D:19:48:28"       # your TV's own Bluetooth address

logger:
api:
ota:
  - platform: esphome
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

button:
  - platform: template
    name: "Xiaomi TV wake"
    on_press:
      - lambda: id(tv_wake).wake();
