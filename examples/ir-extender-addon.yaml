# Added to an ESP32 IR extender's own YAML (astrion-ir-extender, ESP32 builds only: an ESP8266
# has no Bluetooth). Keep everything the extender already has; add these blocks.

external_components:
  - source: github://dckiller51/esphome-xiaomi-ble-wake
    components: [xiaomi_ble_wake]

esp32_ble:

xiaomi_ble_wake:
  id: tv_wake
  remote_mac: "00:E0:4C:FB:BC:21"
  tv_mac: "60:1D:9D:19:48:28"

button:
  - platform: template
    name: "Xiaomi TV wake"
    on_press:
      - lambda: id(tv_wake).wake();
