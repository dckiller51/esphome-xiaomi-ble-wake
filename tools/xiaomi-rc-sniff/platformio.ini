; esphome-xiaomi-ble-wake: what a Xiaomi Bluetooth remote sends when its TV is in deep standby.
; Arduino core 3.x (ESP-IDF 5) is needed for esp_iface_mac_addr_set: the pioarduino platform,
; as the official espressif32 one stays on core 2.x.

[env:esp32dev]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32dev            ; adapt: esp32-c3-devkitm-1, esp32-s3-devkitc-1…
framework = arduino
monitor_speed = 115200
lib_deps =
    h2zero/NimBLE-Arduino@^2.1.0
